<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ウクレレコード変換</title>
<style>
body{font-family:"Hiragino Sans","Yu Gothic",sans-serif;max-width:860px;margin:0 auto;padding:16px;color:#222;line-height:1.6}
textarea{width:100%;height:160px;font-size:13px;box-sizing:border-box}
input,select{font:inherit;max-width:100%;box-sizing:border-box}
button{font-size:14px;padding:6px 14px;border:1px solid #bbb;border-radius:8px;background:#fff;cursor:pointer}
button:hover{background:#f3f3f3}
button.on{background:#eeedfe;border-color:#534ab7;color:#3c3489}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#f6f5f0;border-radius:12px;padding:12px 16px;margin:14px 0}
.hint{font-size:13px;color:#777}
.label{font-size:12px;color:#999;margin:14px 0 2px}
.line{display:flex;flex-wrap:wrap;align-items:flex-end;margin:12px 0}
.seg{display:inline-flex;flex-direction:column;align-items:flex-start;margin-right:2px}
.ch{display:block;font-size:12px;font-weight:600;color:#534ab7;min-height:1.2em;cursor:pointer;white-space:nowrap}
.mini{display:block;margin:1px 0 2px}
.tx{font-size:15px;white-space:pre-wrap}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.card{border:1px solid #ddd;border-radius:8px;padding:4px;transition:border-color .3s}
.capo{font-size:13px;color:#185fa5;margin:4px 0 0}
.library{background:#f6f5f0;border-radius:12px;padding:12px 16px;margin:14px 0}
.library h2{margin:0 0 6px}
.library-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.library-actions input{min-width:180px;padding:6px 8px;border:1px solid #bbb;border-radius:6px}
.library-actions select{min-width:220px;padding:6px 8px;border:1px solid #bbb;border-radius:6px}
.storage-status{font-size:12px;color:#777;margin:6px 0 0}
h1{font-size:20px}h2{font-size:16px;margin-top:28px}
@media print{textarea,.ctrl button,#load,.hint,.library{display:none}}
</style>
</head>
<body>
<p><a href="https://ja.chordwiki.org/">ChordWiki</a> / <a href="sample-chord-chart.html">サンプルコード表</a></p>
<h1>ウクレレコード変換</h1>
<p class="hint">ChordWikiの曲ページで「編集」を開き、<b>[CM7]歌詞…</b> の形式のソーステキストを全部コピーして下に貼り付けてください。保存したデータはこのブラウザ内にだけ保存され、GitHubやサーバーには送信されません。</p>
<textarea id="src" placeholder="ここに貼り付け　例）{title: 曲名}&#10;[CM7]そらに[Bm7]うつれ..."></textarea>
<p><button id="load">読み込む</button></p>

<section class="library" aria-labelledby="library-title">
  <h2 id="library-title">保存した譜面</h2>
  <div class="library-actions">
    <label for="songName">保存名</label>
    <input id="songName" type="text" maxlength="80" placeholder="曲名を入力">
    <button id="saveNew">新規保存</button>
    <button id="saveUpdate" disabled>上書き保存</button>
  </div>
  <div class="library-actions">
    <label for="savedList">開く</label>
    <select id="savedList"><option value="">保存した譜面を選択…</option></select>
    <button id="deleteSaved" disabled>削除</button>
  </div>
  <p id="storageStatus" class="storage-status">この端末・このブラウザ内にだけ保存されます。</p>
</section>

<div id="controls" class="ctrl" style="display:none">
  <span style="font-size:13px;color:#777">移調</span>
  <button id="tdown">−</button><b id="tval">0</b><button id="tup">＋</button>
  <button id="mOrig" class="on">原曲コード</button>
  <button id="mEasy">かんたんコード</button>
  <button id="mDiag" class="on">押さえ方を表示</button>
  <button id="auto">おすすめ設定</button>
  <span id="capo" class="capo"></span>
</div>
<div id="sheet"></div>
<h2 id="gh" style="display:none">押さえ方（登場順）</h2>
<div id="grid"></div>

<script>
const OPEN=[7,0,4,9],NOTES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const QUAL={"":{t:[0,4,7],r:[0,4,7]},"m":{t:[0,3,7],r:[0,3,7]},"7":{t:[0,4,7,10],r:[0,4,10]},
"M7":{t:[0,4,7,11],r:[0,4,11]},"m7":{t:[0,3,7,10],r:[0,3,10]},"6":{t:[0,4,7,9],r:[0,4,9]},
"m6":{t:[0,3,7,9],r:[0,3,9]},"69":{t:[0,2,4,7,9],r:[2,4,9]},"add9":{t:[0,2,4,7],r:[0,2,4]},
"9":{t:[0,2,4,7,10],r:[2,4,10]},"M9":{t:[0,2,4,7,11],r:[2,4,11]},"m9":{t:[0,2,3,7,10],r:[2,3,10]},
"11":{t:[0,2,5,7,10],r:[0,5,10]},"13":{t:[0,2,4,7,9,10],r:[4,9,10]},
"sus4":{t:[0,5,7],r:[0,5,7]},"sus2":{t:[0,2,7],r:[0,2,7]},"7sus4":{t:[0,5,7,10],r:[0,5,10]},
"dim":{t:[0,3,6,9],r:[0,3,6]},"dim7":{t:[0,3,6,9],r:[0,3,6,9]},"m-5":{t:[0,3,6],r:[0,3,6]},
"m7-5":{t:[0,3,6,10],r:[0,3,6,10]},"aug":{t:[0,4,8],r:[0,4,8]},
"m7add11":{t:[0,3,5,7,10],r:[3,5,10]},"madd9":{t:[0,2,3,7],r:[0,2,3]}};
function pc(n){let i=NOTES.indexOf(n[0]);if(n[1]==="#")i++;if(n[1]==="b")i--;return((i%12)+12)%12}
function norm(q){return q.replace(/maj|Maj|△/g,"M")}
function parseChord(name){const p=name.split("/");const m=p[0].match(/^([A-G][#b]?)(.*)$/);
 return m?{root:m[1],qual:norm(m[2]),bass:p[1]||null}:null}
function tname(n,t){return NOTES[((pc(n)+t)%12+12)%12]}
function transposeName(name,t){const p=parseChord(name);if(!p)return name;
 let s=tname(p.root,t)+p.qual;if(p.bass)s+="/"+tname(p.bass,t);return s}
function simplifyQ(q){
 if(/dim|-5/.test(q))return"dim";
 if(/aug/.test(q))return"";
 if(/sus/.test(q))return"sus4";
 if(/^m(?!aj)/.test(q))return/\d|add/.test(q.slice(1))?"m7":"m";
 if(/^M/.test(q))return"";
 if(/7|9|11|13/.test(q))return"7";
 return""}
function simplify(name){const p=parseChord(name);return p?p.root+simplifyQ(p.qual):name}
const vc={};
function voicing(name){
 if(name in vc)return vc[name];
 const p=parseChord(name);if(!p){vc[name]=null;return null}
 const q=QUAL[p.qual]||QUAL[simplifyQ(p.qual)];if(!q){vc[name]=null;return null}
 const rp=pc(p.root),al=new Set(q.t.map(x=>x%12));let best=null;
 for(let a=0;a<=9;a++)for(let b=0;b<=9;b++)for(let c=0;c<=9;c++)for(let d=0;d<=9;d++){
  const fr=[a,b,c,d],iv=fr.map((f,i)=>((OPEN[i]+f-rp)%12+12)%12);
  let ok=iv.every(v=>al.has(v))&&q.r.every(r=>iv.includes(r%12));if(!ok)continue;
  const ft=fr.filter(f=>f>0),span=ft.length?Math.max(...ft)-Math.min(...ft):0;
  if(span>3)continue;
  const mx=Math.max(...fr);
  const sc=fr.reduce((s,f)=>s+f,0)+mx*2+ft.length+span*1.5+(iv.includes(0)?0:2);
  if(!best||sc<best.sc)best={fr,sc,diff:mx*1.5+ft.length+span*2}}
 vc[name]=best;return best}
function fretWindow(fr){
 const ft=fr.filter(f=>f>0),mx=ft.length?Math.max(...ft):0;
 let st=1;if(mx>4){st=Math.min(...ft);if(mx-st+1>4)st=mx-4+1}
 return st}
function diagram(name){
 const v=voicing(name);
 const x0=22,y0=28,fw=18,sh=14,NF=4;
 let s='<svg viewBox="0 0 118 98" width="100%">'
 +'<text x="59" y="14" text-anchor="middle" style="font:600 13px sans-serif;fill:#222">'+name+'</text>';
 if(!v)return s+'<text x="59" y="58" text-anchor="middle" style="font:11px sans-serif;fill:#999">—</text></svg>';
 const fr=v.fr,st=fretWindow(fr);
 if(st===1)s+='<rect x="'+(x0-3)+'" y="'+y0+'" width="3" height="'+(sh*3)+'" fill="#222"/>';
 else s+='<text x="'+(x0+fw/2)+'" y="'+(y0+sh*3+15)+'" text-anchor="middle" style="font:11px sans-serif;fill:#777">'+st+'</text>';
 for(let i=0;i<4;i++)s+='<line x1="'+x0+'" y1="'+(y0+i*sh)+'" x2="'+(x0+fw*NF)+'" y2="'+(y0+i*sh)+'" stroke="#888"/>';
 for(let j=0;j<=NF;j++)s+='<line x1="'+(x0+j*fw)+'" y1="'+y0+'" x2="'+(x0+j*fw)+'" y2="'+(y0+sh*3)+'" stroke="#ccc"/>';
 for(let i=0;i<4;i++){
  const y=y0+(3-i)*sh,f=fr[i];
  if(f===0)s+='<circle cx="'+(x0-11)+'" cy="'+y+'" r="4" fill="none" stroke="#777" stroke-width="1.3"/>';
  else s+='<circle cx="'+(x0+(f-st)*fw+fw/2)+'" cy="'+y+'" r="5.5" fill="#534ab7"/>'}
 ["A","E","C","G"].forEach((n,i)=>{s+='<text x="'+(x0+fw*NF+6)+'" y="'+(y0+i*sh+3.5)+'" style="font:10px sans-serif;fill:#999">'+n+'</text>'});
 return s+'</svg>'}
function miniDiagram(name){
 const v=voicing(name);
 const x0=9,y0=5,fw=10,sh=8,NF=4;
 let s='<svg class="mini" viewBox="0 0 58 42" width="50">';
 if(!v)return s+'<text x="29" y="24" text-anchor="middle" style="font:10px sans-serif;fill:#999">—</text></svg>';
 const fr=v.fr,st=fretWindow(fr);
 if(st===1)s+='<rect x="'+(x0-2)+'" y="'+y0+'" width="2" height="'+(sh*3)+'" fill="#222"/>';
 else s+='<text x="'+(x0+fw/2)+'" y="'+(y0+sh*3+10)+'" text-anchor="middle" style="font:8px sans-serif;fill:#777">'+st+'</text>';
 for(let i=0;i<4;i++)s+='<line x1="'+x0+'" y1="'+(y0+i*sh)+'" x2="'+(x0+fw*NF)+'" y2="'+(y0+i*sh)+'" stroke="#999" stroke-width="0.8"/>';
 for(let j=0;j<=NF;j++)s+='<line x1="'+(x0+j*fw)+'" y1="'+y0+'" x2="'+(x0+j*fw)+'" y2="'+(y0+sh*3)+'" stroke="#ccc" stroke-width="0.8"/>';
 for(let i=0;i<4;i++){
  const y=y0+(3-i)*sh,f=fr[i];
  if(f===0)s+='<circle cx="'+(x0-5.5)+'" cy="'+y+'" r="2.2" fill="none" stroke="#888" stroke-width="1"/>';
  else s+='<circle cx="'+(x0+(f-st)*fw+fw/2)+'" cy="'+y+'" r="3.2" fill="#534ab7"/>'}
 return s+'</svg>'}

const STORAGE_KEY="ukulele-chord-songs-v1",LAST_OPENED_KEY="ukulele-chord-last-opened-v1";
const DEFAULT_STATE={t:0,easy:false,diag:true};
let song=[],state={...DEFAULT_STATE},activeSavedId=null;
function getSavedSongs(){
 try{
  const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
  return Array.isArray(data)?data.filter(x=>x&&typeof x.id==="string"&&typeof x.name==="string"&&typeof x.source==="string"):[];
 }catch(_){return []}
}
function putSavedSongs(songs){
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(songs));return true}
 catch(_){document.getElementById("storageStatus").textContent="保存できませんでした。ブラウザのサイトデータ設定を確認してください。";return false}
}
function titleFromSource(text){
 const m=text.match(/^\{\s*(?:title|t)\s*:\s*(.*?)\s*\}$/im);
 return m&&m[1]?m[1]:"";
}
function safeState(value){
 return {t:Number.isInteger(value&&value.t)&&value.t>=-5&&value.t<=6?value.t:0,easy:!!(value&&value.easy),diag:value&&typeof value.diag==="boolean"?value.diag:true};
}
function makeId(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function refreshSavedList(selectedId=activeSavedId){
 const list=document.getElementById("savedList"),songs=getSavedSongs();
 list.textContent="";
 const placeholder=document.createElement("option");placeholder.value="";placeholder.textContent="保存した譜面を選択…";list.appendChild(placeholder);
 songs.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).forEach(item=>{
  const opt=document.createElement("option");opt.value=item.id;
  opt.textContent=item.name;opt.selected=item.id===selectedId;list.appendChild(opt)});
 document.getElementById("saveUpdate").disabled=!activeSavedId;
 document.getElementById("deleteSaved").disabled=!activeSavedId;
 document.getElementById("storageStatus").textContent=songs.length?`${songs.length}件をこのブラウザ内に保存しています。`:"この端末・このブラウザ内にだけ保存されます。";
}
function loadSource(text,keepName=false){
 document.getElementById("src").value=text;
 song=parseSource(text);
 if(!keepName)document.getElementById("songName").value=titleFromSource(text);
 document.getElementById("controls").style.display="flex";render();
}
function openSavedSong(id){
 const item=getSavedSongs().find(x=>x.id===id);if(!item)return;
 activeSavedId=item.id;state=safeState(item.state);loadSource(item.source,true);
 document.getElementById("songName").value=item.name;
 try{localStorage.setItem(LAST_OPENED_KEY,item.id)}catch(_){}
 refreshSavedList();
}
function saveSong(overwrite){
 const source=document.getElementById("src").value;
 if(!source.trim()){document.getElementById("storageStatus").textContent="保存するコード譜を貼り付けてから読み込んでください。";return}
 const name=document.getElementById("songName").value.trim()||titleFromSource(source)||"名称未設定";
 const songs=getSavedSongs(),now=Date.now();
 let item=overwrite&&activeSavedId?songs.find(x=>x.id===activeSavedId):null;
 if(item){Object.assign(item,{name,source,state:{...state},updatedAt:now})}
 else{item={id:makeId(),name,source,state:{...state},updatedAt:now};songs.push(item);activeSavedId=item.id}
 if(putSavedSongs(songs)){document.getElementById("songName").value=name;try{localStorage.setItem(LAST_OPENED_KEY,activeSavedId)}catch(_){}refreshSavedList()}
}
function parseSource(text){
 const out=[];
 text.split(/\r?\n/).forEach(line=>{
  const d=line.match(/^\{(.+?)(?::(.*))?\}$/);
  if(d){const k=d[1].trim().toLowerCase();
   if(k==="title"||k==="t")out.push({type:"title",text:(d[2]||"").trim()});
   else if(k==="comment"||k==="c")out.push({type:"label",text:(d[2]||"").trim()});
   return}
  if(!line.trim()){out.push({type:"blank"});return}
  const segs=[];const re=/\[([^\]]+)\]/g;let last=0,m,cur=null;
  while((m=re.exec(line))){
   const txt=line.slice(last,m.index);
   if(cur)segs.push({ch:cur,tx:txt});else if(txt)segs.push({ch:null,tx:txt});
   cur=m[1];last=re.lastIndex}
  const rest=line.slice(last);
  if(cur)segs.push({ch:cur,tx:rest});else if(rest)segs.push({ch:null,tx:rest});
  if(segs.length)out.push({type:"line",segs})});
 return out}
function dispName(c){return transposeName(state.easy?simplify(c):c,state.t)}
function fingName(c){const p=parseChord(dispName(c));return p?p.root+p.qual:c}
function render(){
 document.getElementById("tval").textContent=(state.t>0?"+":"")+state.t;
 document.getElementById("mOrig").className=state.easy?"":"on";
 document.getElementById("mEasy").className=state.easy?"on":"";
 document.getElementById("mDiag").className=state.diag?"on":"";
 const cp=document.getElementById("capo");
 cp.textContent=state.t<0?"カポ "+(-state.t)+" フレットで原曲キー":state.t>0?"原曲より高くなります":"カポなし・原曲キー";
 const sheet=document.getElementById("sheet");sheet.innerHTML="";
 const seen=[],seenS={};
 song.forEach(item=>{
  if(item.type==="title"){const h=document.createElement("h2");h.textContent=item.text;sheet.appendChild(h)}
  else if(item.type==="label"){const p=document.createElement("p");p.className="label";p.textContent="― "+item.text+" ―";sheet.appendChild(p)}
  else if(item.type==="blank"){sheet.appendChild(document.createElement("br"))}
  else if(item.type==="line"){
   const div=document.createElement("div");div.className="line";
   item.segs.forEach(sg=>{
    const sp=document.createElement("span");sp.className="seg";
    const ch=document.createElement("span");ch.className="ch";
    let fn=null;
    if(sg.ch){fn=fingName(sg.ch);ch.textContent=dispName(sg.ch);
     if(!seenS[fn]){seenS[fn]=1;seen.push(fn)}
     ch.onclick=()=>{const el=document.getElementById("dg-"+fn);
      if(el){el.scrollIntoView({behavior:"smooth",block:"center"});
       el.style.borderColor="#534ab7";setTimeout(()=>el.style.borderColor="#ddd",1500)}}}
    else ch.innerHTML="&nbsp;";
    sp.appendChild(ch);
    if(fn&&state.diag){
     const dg=document.createElement("span");
     dg.innerHTML=miniDiagram(fn);
     sp.appendChild(dg.firstChild)}
    const tx=document.createElement("span");tx.className="tx";tx.textContent=sg.tx||"\u00a0";
    sp.appendChild(tx);div.appendChild(sp)});
   sheet.appendChild(div)}});
 const g=document.getElementById("grid");g.innerHTML="";
 seen.forEach(fn=>{const c=document.createElement("div");c.className="card";c.id="dg-"+fn;
  c.innerHTML=diagram(fn);g.appendChild(c)});
 document.getElementById("gh").style.display=seen.length?"":"none"}
document.getElementById("load").onclick=()=>{
 activeSavedId=null;
 loadSource(document.getElementById("src").value);
 refreshSavedList()};
document.getElementById("saveNew").onclick=()=>saveSong(false);
document.getElementById("saveUpdate").onclick=()=>saveSong(true);
document.getElementById("savedList").onchange=e=>{if(e.target.value)openSavedSong(e.target.value)};
document.getElementById("deleteSaved").onclick=()=>{
 if(!activeSavedId||!confirm("この保存済み譜面を、このブラウザから削除しますか？"))return;
 const songs=getSavedSongs().filter(item=>item.id!==activeSavedId);
 if(putSavedSongs(songs)){
  try{if(localStorage.getItem(LAST_OPENED_KEY)===activeSavedId)localStorage.removeItem(LAST_OPENED_KEY)}catch(_){}
  activeSavedId=null;document.getElementById("songName").value="";refreshSavedList();
 }};
document.getElementById("tup").onclick=()=>{if(state.t<6){state.t++;render()}};
document.getElementById("tdown").onclick=()=>{if(state.t>-5){state.t--;render()}};
document.getElementById("mOrig").onclick=()=>{state.easy=false;render()};
document.getElementById("mEasy").onclick=()=>{state.easy=true;render()};
document.getElementById("mDiag").onclick=()=>{state.diag=!state.diag;render()};
document.getElementById("auto").onclick=()=>{
 let best=0,bs=Infinity;
 for(let t=0;t>=-5;t--){
  const set={};let tot=0,bad=false;
  song.forEach(it=>{if(it.type==="line")it.segs.forEach(sg=>{
   if(sg.ch){const p=parseChord(transposeName(simplify(sg.ch),t));if(p)set[p.root+p.qual]=1}})});
  for(const n in set){const v=voicing(n);if(!v){bad=true;break}tot+=v.diff}
 if(!bad&&tot<bs){bs=tot;best=t}}
 state.t=best;state.easy=true;render()};
refreshSavedList();
try{const lastOpened=localStorage.getItem(LAST_OPENED_KEY);if(lastOpened)openSavedSong(lastOpened)}catch(_){}
</script>
</body>
</html>
